project: neurofind
model: DINOv3

data:
  folder: data/time_data_labeled

  stacks: 
    A1: 33648_A1_TS_dftcorr.tif
    A5: 33648_A5_TS_dftcorr.tif
    B2: 33648_B2_TS_dftcorr.tif

  labels:
    A1: 33648_A1_TS_dftcorr_01.csv
    A5: 33648_A5_TS_dftcorr_02.csv
    B2: 33648_B2_TS_dftcorr_04.csv

  # Each stack (A1, A5, B2) is an independent 4D acquisition (X, Y, Z and Time) of different sample.
  # The pairing is within one stack, across its own time dimension, e.g., A5 frame 0 -> A5 frame 1, tracking the same labelled spine in the same sample over time.
  # H1 uses query_frame=0, target_frame=1 within stack A5.

volume_index:
  query: 0
  target: 1

crop_size:
  z: 7
  y: 128
  x: 128

embeddings:
  status: completed
  computed_stacks:
    - A5
  note: Embeddings are computed per stack, only A5 is being used for the experiments.

baseline:
  name: full_search
  description: Search over all candidate points in the target stack.

hypotheses:
  h1:
    name: local_search
    stack: A5
    frame_pair:
      query_frame: 0
      target_frame: 1
    hypothesis: A smaller area around the selected point gives the same match as full candidate search, but faster.
    compare_strategies:
      - full_search
      - euclidean
      - manhattan
      - knn
    area_percentages: [0.25, 0.40]
    correctness_reference: human_labels
    metrics:
      - distance_to_human_label_um
      - number_of_candidates
      - runtime_seconds
      - area_clipped_fraction

  h2:
    name: grid_search
    hypothesis: I want to test different combinations of search area and candidate selection around the clicked point to find which setup gives the best balance between accuracy and search time.
    compare_strategies:
      - full_search
      - grid_search
    candidate_selection:
      - bright
      - less bright
      - dark
    correctness_reference: human_labels
    metrics: 
      - accuracy
      - runtime_seconds
      - num_candidates
    note: h2 is in progress!


